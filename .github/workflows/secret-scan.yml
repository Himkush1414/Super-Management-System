# Scans every push and pull request for secrets (keys, tokens, passwords,
# PINs) with gitleaks; a finding fails the check. Rules:
# .github/gitleaks.toml. GitHub's own push protection is also on for this
# repository and refuses known token formats before they land.
name: Secret scan

on:
  push:
  pull_request:

# read-only token, spelled read-all because the website's Tailwind build
# scans this file and the scope name is also a class name
permissions: read-all

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
