# Supabase CLI config for NR Industries.
# `supabase link --project-ref ywzwzrzlittjiosskmcy` then `supabase db push`
# for the hosted project, or `supabase start` + `supabase db reset` locally.
project_id = "ywzwzrzlittjiosskmcy"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_signup = true
# Email confirmation is disabled so approved users can sign in immediately —
# the app's own pending/active gate is the real access control.
[auth.email]
enable_confirmations = false
enable_signup = true
# OTP length used by the login second factor.
otp_length = 6
otp_expiry = 600

# The sign-up wizard and the sign-in second factor both ask the user to type
# a 6-digit code. GoTrue's built-in "magic link" template only renders a
# clickable link — it never exposes the numeric token — so without this
# override the code the UI promises never actually reaches the user's inbox.
[auth.email.template.magic_link]
subject = "Your NR Industries verification code"
content_path = "./supabase/templates/magic_link.html"

[realtime]
enabled = true
