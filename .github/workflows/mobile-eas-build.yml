# Builds the NR Management Android app on EAS. Manual only: it never runs
# on pushes or pull requests (so website-only changes never trigger it),
# and it never touches Vercel or the website.
#
# One-time: add the repository secret EXPO_TOKEN
# (GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret).
name: Mobile · EAS Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview or production-apk = installable APK, production = Play bundle)"
        type: choice
        options: [preview, production-apk, production]
        default: preview
      wait:
        description: "Wait for the build to finish and print its link"
        type: boolean
        default: true

# read-only token (checkout only). Every action is pinned by commit, and the
# EAS CLI by version, because this job holds the Expo token.
permissions:
  contents: read

concurrency:
  group: mobile-eas-build
  cancel-in-progress: false

jobs:
  build:
    name: Check and build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Require the EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret first (see the top of this workflow)."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 25.2.0 # pinned: the version every release so far was built with
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build on EAS
        env:
          PROFILE: ${{ inputs.profile }}
          WAIT_FOR_BUILD: ${{ inputs.wait }}
        run: |
          if [ "$WAIT_FOR_BUILD" = "true" ]; then WAIT=--wait; else WAIT=--no-wait; fi
          eas build --platform android --profile "$PROFILE" --non-interactive "$WAIT"
